<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Love You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05080f;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    class TextParticle {
      constructor(x, y, text, delay) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.delay = delay;
        this.alpha = 0;
        this.maxAlpha = 0.7 + Math.random() * 0.3;
        this.flickerSpeed = 0.03 + Math.random() * 0.05;
        this.flickerOffset = Math.random() * Math.PI * 2;
      }

      update(frame) {
        if (frame > this.delay && this.alpha < this.maxAlpha) {
          this.alpha = Math.min(this.maxAlpha, this.alpha + 0.02 + Math.random() * 0.03);
        }
      }

      draw(ctx, frame) {
        if (this.alpha <= 0) return;

        const flick = 0.8 + 0.2 * Math.sin(frame * this.flickerSpeed + this.flickerOffset);
        const curAlpha = this.alpha * flick;

        ctx.save();
        ctx.font = "bold 13px Consolas, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowColor = "#0096ff";
        ctx.shadowBlur = 12;
        ctx.fillStyle = `rgba(140, 220, 255, ${curAlpha})`;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    const particles = [];
    const numPoints = 140;
    const isMobile = window.innerWidth < 600;
    const scale = isMobile ? (window.innerWidth / 35) : 16.5;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2 - (isMobile ? 10 : 20);

    for (let i = 0; i < numPoints; i++) {
      const t = Math.PI - (2.0 * Math.PI * i / numPoints);
      const x = 16.0 * Math.pow(Math.sin(t), 3.0);
      const y = -(13.0 * Math.cos(t) - 5.0 * Math.cos(2.0 * t) - 2.0 * Math.cos(3.0 * t) - Math.cos(4.0 * t));

      const px = centerX + x * scale + (Math.random() * 8 - 4);
      const py = centerY + y * scale + (Math.random() * 8 - 4);
      const delay = Math.floor(i * 1.5);

      particles.push(new TextParticle(px, py, "Love You", delay));
    }

    for (let i = 0; i < 80; i++) {
      const t = Math.random() * 2.0 * Math.PI;
      const r = 0.1 + Math.random() * 0.75;
      const x = 16.0 * Math.pow(Math.sin(t), 3.0) * r;
      const y = -(13.0 * Math.cos(t) - 5.0 * Math.cos(2.0 * t) - 2.0 * Math.cos(3.0 * t) - Math.cos(4.0 * t)) * r;

      const px = centerX + x * scale + (Math.random() * 16 - 8);
      const py = centerY + y * scale + (Math.random() * 16 - 8);
      const delay = 120 + Math.floor(Math.random() * 120);

      particles.push(new TextParticle(px, py, "Love You", delay));
    }

    let frame = 0;
    const centerStartFrame = 240;
    let centerAlpha = 0;

    function animate() {
      frame++;
      ctx.fillStyle = "#05080f";
      ctx.fillRect(0, 0, width, height);

      for (const p of particles) {
        p.update(frame);
        p.draw(ctx, frame);
      }

      if (frame > centerStartFrame) {
        if (centerAlpha < 1) {
          centerAlpha = Math.min(1, centerAlpha + 0.015);
        }

        const flick = 0.9 + 0.1 * Math.sin(frame * 0.05);
        const cAlpha = centerAlpha * flick;

        ctx.save();
        const fontSize = isMobile ? 32 : 48;
        ctx.font = `bold ${fontSize}px Georgia, serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowColor = "#0096ff";
        ctx.shadowBlur = 20;
        ctx.fillStyle = `rgba(230, 245, 255, ${cAlpha})`;
        ctx.fillText("Love You", centerX, centerY);
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
